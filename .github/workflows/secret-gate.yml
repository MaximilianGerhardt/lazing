name: secret-gate

# Fail any push/PR that reintroduces owner/client PII or committed secrets.
# This is the safety net for the de-sensitized public repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  token-denylist:
    name: token denylist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for forbidden owner/client tokens
        shell: bash
        run: |
          set -uo pipefail
          # Deny-list of strings that must NEVER appear in the public repo.
          # NOTE: the GitHub handle in repo URLs (MaximilianGerhardt/lazing) and the
          # author credit "Maximilian Gerhardt" are allowed; this list is specific.
          PATTERN='p-a\\?\.llc|prime[ -]?associates|pa-website|greenlight-fitness|energie-?heimat|energieheimat|montorrent|\bjunto\b|\bcgmh\b|\bvesso\b|bodylab|trusted[ -]?ai[ -]?partners|god[ -]?meets[ -]?humans|aivinity|\bmueller\b|@mueller|/home/dev|/Users/dev|maximiliangerhardtofficial|@gmail\.com|\.env\.prime|credential-manifest|tail0f191d|formerly-knives'
          # Exclude the gate's own files — they contain the denylist strings by design.
          if grep -rniE "$PATTERN" \
               --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next \
               --exclude=secret-gate.yml --exclude=oss-sync.sh --exclude=RELEASING.md \
               . ; then
            echo "::error::Forbidden owner/client token found above. Scrub it before merging."
            exit 1
          fi
          echo "OK — no forbidden tokens."
