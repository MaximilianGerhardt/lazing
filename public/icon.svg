<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FF9F0A" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#FF9F0A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070707" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <!-- Canvas -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#070707"/>
  <!-- Ambient Glow -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- Soft backlight behind L -->
  <path d="M 176 128 L 176 384 L 352 384" stroke="#FF9F0A" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.22" filter="url(#soft)"/>
  <!-- Primary L -->
  <path d="M 176 128 L 176 384 L 352 384" stroke="url(#ink)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Accent Dot -->
  <circle cx="352" cy="384" r="14" fill="#FF9F0A"/>
</svg>
